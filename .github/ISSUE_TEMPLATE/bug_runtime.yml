name: Runtime issue
description: Report a problem with a configured HomeWhiz device or entity.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when HomeWhiz is already set up, but a device, entity, value, or command is not working correctly.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Describe the failing device, entity, value, or command.
    validations:
      required: true

  - type: input
    id: homewhiz_version
    attributes:
      label: HomeWhiz version
      placeholder: v0.5.25
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.8.2
    validations:
      required: true

  - type: dropdown
    id: connection_type
    attributes:
      label: Connection type
      options:
        - Bluetooth
        - Cloud
        - Unknown
    validations:
      required: true

  - type: input
    id: appliance
    attributes:
      label: Appliance information
      description: Brand, model, appliance type, and digital ID if known.
      placeholder: Bauknecht dryer, 7188239270
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Download the HomeWhiz integration diagnostics while the problem is visible, if possible. Review it before posting.
      placeholder: Drag and drop the diagnostics file here.
    validations:
      required: true

  - type: textarea
    id: debug_log
    attributes:
      label: Debug log
      description: Enable debug logging for HomeWhiz, reproduce the issue, then attach the downloaded log.
      render: txt
    validations:
      required: true
