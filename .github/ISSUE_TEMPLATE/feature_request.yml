name: Feature request
description: Request support for a device, entity, value, or command.
labels: [feature request]
body:
- type: textarea
  id: feature
  attributes:
    label: Feature description
    description: Describe the missing device, entity, value, or command.
  validations:
    required: true

- type: input
  id: homewhiz_version
  attributes:
    label: HomeWhiz version
    placeholder: v0.5.25
  validations:
    required: true

- type: input
  id: home_assistant_version
  attributes:
    label: Home Assistant version
    placeholder: 2026.8.2
  validations:
    required: true

- type: dropdown
  id: connection_type
  attributes:
    label: Connection type
    options:
    - Bluetooth
    - Cloud
    - Unknown
  validations:
    required: true

- type: input
  id: appliance
  attributes:
    label: Appliance information
    description: Brand, model, appliance type, and digital ID if known.
    placeholder: Grundig refrigerator, 7292146991
  validations:
    required: true

- type: textarea
  id: diagnostics
  attributes:
    label: Diagnostics
    description: For missing device or entity support, attach HomeWhiz diagnostics if available. Review it before posting.
    placeholder: Drag and drop the diagnostics file here.
  validations:
    required: false
